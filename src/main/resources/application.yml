spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  agent-name: ${LIVEKIT_AGENT_NAME:interviewer-agent}

llm:
  provider: ${LLM_PROVIDER:mock}
  bedrock:
    region: ${AWS_REGION:us-east-1}
    model-id: ${LLM_MODEL:us.anthropic.claude-sonnet-4-6}
    max-tokens: ${LLM_MAX_TOKENS:1200}
    temperature: ${LLM_TEMPERATURE:0.2}

aws:
  region: ${AWS_REGION:us-east-1}

evaluation:
  dispatcher: ${EVALUATION_DISPATCHER:sqs}
  queue:
    turn-url: ${TURN_EVALUATION_QUEUE_URL:}
    turn-name: ${TURN_EVALUATION_QUEUE_NAME:pj-kmucd1-10-turn-evaluation}
    session-url: ${SESSION_EVALUATION_QUEUE_URL:}
    session-name: ${SESSION_EVALUATION_QUEUE_NAME:pj-kmucd1-10-session-evaluation}

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000  # 1시간 (밀리초). 리프레쉬 토큰 추가시 짧게 바꿔야 함.

internal:
  service-token: ${INTERNAL_SERVICE_TOKEN:default-dev-token}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
